<form class="calc" id="hm" onsubmit="return false">
  <label>Window <select id="hm-win">
    <option value="250">last year</option><option value="750" selected>last 3 years</option><option value="1250">last 5 years</option>
  </select></label>
  <label>Moves <select id="hm-mkt">
    <option value="raw">all of each stock’s move</option><option value="resid" selected>market removed</option>
  </select></label>
  <label>Returns <select id="hm-freq">
    <option value="daily" selected>daily</option><option value="weekly">weekly</option>
  </select></label>
  <label>Method <select id="hm-meth">
    <option value="pearson" selected>Pearson (values)</option><option value="rank">Spearman (ranks)</option>
  </select></label>
  <label>Order <select id="hm-ord">
    <option value="cluster" selected>by cluster</option><option value="sector">by NSE sector</option>
  </select></label>
</form>
<p class="note" id="hm-note" aria-live="polite"></p>
<div id="hm-chart" class="sim-chart heat" role="img" aria-label="Correlation heatmap of the NIFTY 50 stocks"></div>
<h3 id="hm-pair-title">Click a square to see that pair over time</h3>
<div id="hm-pair" class="sim-chart" role="img" aria-label="Correlation of the chosen pair through time"></div>
<h3>The market’s skeleton: minimum spanning tree</h3>
<p class="note" id="hm-tree-note"></p>
<div id="hm-tree" class="sim-chart tree" role="img" aria-label="Minimum spanning tree of the stocks for the chosen settings"></div>
<script>
$js
const HM = $data;
(() => {
  const SCALE = 1e-5, el = (id) => document.getElementById(id);
  const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
  const cols = Object.fromEntries(Object.entries(HM.r).map(([k, v]) => [k, v.map((x) => x === null ? null : x * SCALE)]));
  const base = () => ({ paper_bgcolor: css("--surface"), plot_bgcolor: css("--surface"),
    font: { family: getComputedStyle(document.body).fontFamily, color: css("--text-2"), size: 12 } });
  let pair = null;
  const slice = (w) => Object.fromEntries(Object.entries(cols).map(([k, v]) => [k, v.slice(-w)]));
  const fmt = (x) => x.toFixed(2).replace("-", "−");
  const update = () => {
    const w = parseInt(el("hm-win").value, 10), resid = el("hm-mkt").value === "resid";
    const weekly = el("hm-freq").value === "weekly";
    const data = weekly ? toWeekly(slice(w), HM.dates.slice(-w)).cols : slice(w), len = data.NIFTY.length;
    const names = HM.symbols.filter((s) => data[s].filter((x) => x !== null).length > 0.8 * len);
    const { c, days } = corrMatrix(data, names, resid ? "NIFTY" : null, el("hm-meth").value === "rank");
    let order = names.map((_, i) => i);
    if (el("hm-ord").value === "cluster") order = clusterOrder(c, 12).order;
    else order.sort((a, b) => (HM.sectors[names[a]] + names[a]).localeCompare(HM.sectors[names[b]] + names[b]));
    const labs = order.map((i) => names[i]);
    const z = order.map((i) => order.map((j) => i === j ? null : c[i][j]));
    const text = order.map((i) => order.map((j) => `${names[i]} (${HM.short[HM.sectors[names[i]]]}) × ${names[j]} (${HM.short[HM.sectors[names[j]]]}): ${fmt(c[i][j])}`));
    let s = 0, n = 0;
    for (let i = 0; i < c.length; i++) for (let j = i + 1; j < c.length; j++) { s += c[i][j]; n++; }
    const left = HM.symbols.length - names.length, ev = eigenvalues(c), [, hi] = mpBounds(names.length, days);
    const sig = ev.filter((e) => e > hi).length;
    el("hm-note").textContent = `${names.length} stocks over ${days} ${weekly ? "weeks" : "trading days"} to ${HM.last}; average ${el("hm-meth").value === "rank" ? "rank " : ""}correlation ${fmt(s / n)}` +
      (resid ? " after taking out each stock’s beta × NIFTY." : ".") + (left ? ` ${left} stock${left > 1 ? "s" : ""} with too little history left out.` : "") +
      ` ${sig} of ${names.length} factors stand above the noise band (eigenvalue ${hi.toFixed(2)}); the first explains ${Math.round(ev[0] / names.length * 100)}% of all movement.`;
    Plotly.react("hm-chart", [{ type: "heatmap", z, x: labs, y: labs, text, hoverinfo: "text", zmin: -0.8, zmax: 0.8,
      colorscale: [[0, "#2166ac"], [0.5, css("--surface")], [1, "#b2182b"]], xgap: 0.5, ygap: 0.5,
      colorbar: { thickness: 10, title: { text: "correlation", side: "right" } } }],
      Object.assign(base(), { margin: { l: 90, r: 10, t: 10, b: 90 }, xaxis: { tickfont: { size: 8 }, tickangle: -90 },
        yaxis: { tickfont: { size: 8 }, autorange: "reversed" } }), { displaylogo: false, responsive: true });
    drawTree(c, names);
    el("hm-chart").on("plotly_click", (ev) => { const p = ev.points[0]; if (p.x !== p.y) { pair = [p.y, p.x]; drawPair(); } });
    drawPair();
  };
  const drawTree = (c, names) => {
    const edges = mstEdges(c), deg = new Array(names.length).fill(0);
    edges.forEach(([i, j]) => { deg[i]++; deg[j]++; });
    const root = deg.indexOf(Math.max(...deg)), xy = radialLayout(edges, names.length, root);
    const ex = [], ey = [];
    edges.forEach(([i, j]) => { ex.push(xy[i][0], xy[j][0], null); ey.push(xy[i][1], xy[j][1], null); });
    const avg = edges.reduce((a, [i, j]) => a + c[i][j], 0) / edges.length;
    const hubs = names.map((s, i) => [s, deg[i]]).sort((a, b) => b[1] - a[1]).slice(0, 3).map(([s, d]) => `${s} (${d})`).join(", ");
    el("hm-tree-note").textContent = `The ${edges.length} links that join all ${names.length} stocks with the highest correlations, no loops; average link correlation ${fmt(avg)}. Biggest hubs: ${hubs}. Colour = NSE sector.`;
    const group = (s) => HM.colours[HM.sectors[s]] === HM.other ? "other sectors" : HM.short[HM.sectors[s]];
    const colourOf = (g) => g === "other sectors" ? HM.other : HM.colours[Object.keys(HM.short).find((k) => HM.short[k] === g)];
    const secs = [...new Set(names.map(group))].sort((a, b) => (a === "other sectors") - (b === "other sectors"));
    Plotly.react("hm-tree", [{ x: ex, y: ey, mode: "lines", line: { color: css("--grid"), width: 1.5 }, hoverinfo: "skip", showlegend: false }]
      .concat(secs.map((sec) => { const idx = names.map((s, i) => i).filter((i) => group(names[i]) === sec);
        return { x: idx.map((i) => xy[i][0]), y: idx.map((i) => xy[i][1]), mode: "markers+text", text: idx.map((i) => names[i]),
          textposition: "top center", textfont: { size: 8, color: css("--text-2") }, marker: { size: idx.map((i) => 6 + 2 * deg[i]), color: colourOf(sec) },
          name: sec, hovertemplate: idx.map((i) => `${names[i]}: ${deg[i]} link${deg[i] > 1 ? "s" : ""}<extra>${HM.short[HM.sectors[names[i]]]}</extra>`) }; })),
      Object.assign(base(), { margin: { l: 8, r: 8, t: 8, b: 8 }, showlegend: true, legend: { font: { size: 9 } },
        xaxis: { visible: false, scaleanchor: "y" }, yaxis: { visible: false } }), { displaylogo: false, responsive: true });
  };
  const drawPair = () => {
    if (!pair) return;
    const resid = el("hm-mkt").value === "resid", [a, b] = pair;
    let series = cols;
    if (resid) {  // residuals over the full five years, then the rolling correlation of those
      const rows = completeRows(cols, [a, b, "NIFTY"]), m = rows.map((t) => cols.NIFTY[t]);
      const mm = m.reduce((x, y) => x + y, 0) / m.length, vm = m.reduce((x, y) => x + (y - mm) ** 2, 0);
      const res = (k) => { const x = rows.map((t) => cols[k][t]), mx = x.reduce((p, q) => p + q, 0) / x.length;
        let cv = 0; x.forEach((v, i) => { cv += (v - mx) * (m[i] - mm); }); const beta = cv / vm;
        const out = new Array(cols[k].length).fill(null); rows.forEach((t, i) => { out[t] = x[i] - beta * m[i]; }); return out; };
      series = { [a]: res(a), [b]: res(b) };
    }
    const roll = rollingPair(series, a, b, 63, null), ew = ewmaPair(series, a, b, 0.94);
    el("hm-pair-title").textContent = `${a} and ${b}: correlation through time${resid ? ", market removed" : ""}`;
    Plotly.react("hm-pair", [
      { x: HM.dates, y: ew, mode: "lines", line: { color: css("--muted"), width: 1 }, name: "EWMA (λ 0.94)", hovertemplate: "%{x}: EWMA %{y:.2f}<extra></extra>" },
      { x: HM.dates, y: roll, mode: "lines", line: { color: css("--accent"), width: 2 }, name: "past 63 days", hovertemplate: "%{x}: 63 days %{y:.2f}<extra></extra>" }],
      Object.assign(base(), { margin: { l: 56, r: 16, t: 32, b: 40 }, showlegend: true, legend: { orientation: "h", y: 1.02, yanchor: "bottom", x: 0 },
        xaxis: { gridcolor: css("--grid") }, yaxis: { title: "correlation", range: [-0.6, 1], gridcolor: css("--grid"), zeroline: true, zerolinecolor: css("--grid") } }),
      { displaylogo: false, responsive: true });
  };
  el("hm").addEventListener("change", update);
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", update);
  update();
})();
</script>
